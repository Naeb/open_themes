AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "open_themes.gemspec"

Metrics/ClassLength:
  Exclude:
    - "lib/generators/open_themes/install/install_generator.rb"

Metrics/MethodLength:
  Exclude:
    - "spec/**/*"
    - "lib/generators/open_themes/install/install_generator.rb"
    - "lib/open_themes/helpers.rb"
    - "lib/open_themes/exporters/json.rb"

Metrics/AbcSize:
  Exclude:
    - "spec/**/*"

Metrics/CyclomaticComplexity:
  Max: 10
