AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "open_themes.gemspec"

Metrics/ClassLength:
  Exclude:
    - "lib/generators/open_themes/install/install_generator.rb"

Metrics/MethodLength:
  Max: 15
  Exclude:
    - "spec/**/*"

Metrics/AbcSize:
  Max: 20
  Exclude:
    - "spec/**/*"

Metrics/CyclomaticComplexity:
  Max: 10
