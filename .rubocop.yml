AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"
    - "lib/generators/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "open_themes.gemspec"

Metrics/ClassLength:
  Max: 100

Metrics/MethodLength:
  Max: 15
  Exclude:
    - "spec/**/*"

Metrics/AbcSize:
  Max: 20
  Exclude:
    - "spec/**/*"

Metrics/PerceivedComplexity:
  Max: 8

Metrics/BlockNesting:
  Max: 3

Metrics/CyclomaticComplexity:
  Max: 10
